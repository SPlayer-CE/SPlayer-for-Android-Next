apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'org.owasp.dependencycheck'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "top.imsyy.splayer_next.android"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "top.imsyy.splayer_next"
        minSdk = 29
        targetSdk = 36
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 分架构构建：每个 ABI 生成独立 APK，不再生成 universal 合包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }

    packagingOptions {
        doNotStrip "*/arm64-v8a/libnode.so"
        doNotStrip "*/armeabi-v7a/libnode.so"
        doNotStrip "*/x86_64/libnode.so"
        doNotStrip "*/x86/libnode.so"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.AdrienPoupa:jaudiotagger:2.2.3'
    testImplementation "junit:junit:$junitVersion"
    // JVM 单测里 org.json 是 android.jar 的 stub，需引入真实实现供 FmFetcher 等解析测试使用
    testImplementation 'org.json:json:20231013'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// detekt 静态分析配置：仅生成报告，不中断构建
detekt {
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = true
    config.setFrom(files("$rootDir/detekt-config.yml"))
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    ignoreFailures = true
    reports {
        html.required = true
        xml.required = true
        txt.required = false
        sarif.required = false
    }
}

// OWASP 依赖漏洞检查配置：仅生成报告，不中断构建
dependencyCheck {
    failBuildOnCVSS = 11
    formats = ['HTML', 'JSON']
}

// ktlint 代码风格检查配置：仅生成报告，不中断构建
ktlint {
    version.set("1.3.1")
    android.set(true)
    outputToConsole.set(true)
    ignoreFailures.set(true)
}

// compileKotlin 别名任务：统一触发 Debug 与 Release 两个变体的 Kotlin 编译
// Android 项目原生只有 compileDebugKotlin 与 compileReleaseKotlin，没有统一的 compileKotlin
tasks.register('compileKotlin') {
    dependsOn 'compileDebugKotlin', 'compileReleaseKotlin'
    group = 'build'
    description = '编译 Debug 与 Release 两个变体的 Kotlin 代码（别名任务）'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
