name: Android Build

on:
  push:
    branches: [Android]
    tags: ["v*"]
  pull_request:
    branches: [Android]
    types: [opened, synchronize, reopened, labeled]

defaults:
  run:
    shell: bash

jobs:
  # PR 时做构建前置校验 + 静态检查（内嵌 Node 打包 / ktlint / Kotlin 编译 / detekt），拦截破坏构建的改动
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 Web 并同步 Capacitor
        # android 工程配置阶段依赖 cap sync 产物（capacitor-cordova-android-plugins/cordova.variables.gradle 等），
        # 新克隆仓库必须先 build:web + cap sync，否则 gradle 配置阶段即报脚本不存在
        run: pnpm build:web && pnpm cap:sync
      - name: 校验内嵌 Node 服务打包
        # API/ 是内嵌 Node.js Mobile 服务源，PR 常改它；其 esbuild 打包曾因对 electron/main 的隐性依赖回归而失败，
        # 而 gradle 静态校验只覆盖 Kotlin，故单独守护 build:android:node
        run: pnpm build:android:node
      - name: 静态校验
        # 直接用 ./gradlew：package.json 的 android:check 用裸 gradlew，在 Linux bash 下当前目录不在 PATH 会报 gradlew not found
        run: cd android && ./gradlew ktlintCheck compileKotlin detekt

  # 根据触发事件动态计算 build job 应执行的变体列表
  # job 级 if 不支持 matrix 上下文，故用独立 needs job 输出 variants JSON 数组驱动 matrix
  build-variants:
    # 防递归守卫：softprops/action-gh-release 为 debug 变体自动创建 v*-debug 派生 tag，
    # GitHub API 创建的 tag 不触发 push event（无递归），此处 !endsWith 为双重保险
    if: >-
      github.event_name != 'pull_request' &&
      !endsWith(github.ref_name, '-debug')
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.calc.outputs.variants }}
    steps:
      - id: calc
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'variants=["release","debug"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["release"]' >> "$GITHUB_OUTPUT"
          fi

  # push Android 分支 / 打 v* tag 时构建签名 APK（分 ABI 出包）
  # 分支 push → 仅 release；v* tag push → release + debug 双包双 Release
  build:
    needs: build-variants
    if: >-
      github.event_name != 'pull_request' &&
      !endsWith(github.ref_name, '-debug')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.build-variants.outputs.variants) }}
    permissions:
      contents: write
    steps:
      # 完整历史：tag 构建需读取上一 tag..当前 tag 区间的提交正文生成 Release 说明
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已从 secrets 恢复正式签名密钥"
          else
            echo "未配置签名 secrets，回退 debug 签名（app/build.gradle 自带回退逻辑）"
          fi
      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 计算变体参数
        id: variant
        run: |
          if [ "${{ matrix.variant }}" = "release" ]; then
            echo "src_dir=android/app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            echo "src_suffix=-release.apk" >> "$GITHUB_OUTPUT"
            echo "file_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "src_dir=android/app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "src_suffix=-debug.apk" >> "$GITHUB_OUTPUT"
            echo "file_tag=${GITHUB_REF_NAME}-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Release APK
        if: matrix.variant == 'release'
        run: cd android && ./gradlew assembleRelease --stacktrace
      - name: 构建 Debug APK
        if: matrix.variant == 'debug'
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist-android
          SRC_DIR="${{ steps.variant.outputs.src_dir }}"
          SRC_SUFFIX="${{ steps.variant.outputs.src_suffix }}"
          FILE_TAG="${{ steps.variant.outputs.file_tag }}"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${SRC_DIR}/app-${abi}${SRC_SUFFIX}"
            if [ -f "$src" ]; then
              cp "$src" "dist-android/SPlayer-Next-${FILE_TAG}-${abi}.apk"
            fi
          done
          [ -n "$(ls -A dist-android 2>/dev/null)" ] || {
            echo "::error::No APK collected from ${SRC_DIR}"
            ls -la "$SRC_DIR" 2>/dev/null || echo "source dir does not exist"
            exit 1
          }
          ls -la dist-android
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-${{ matrix.variant }}-APKs-${{ github.run_number }}
          path: dist-android/*.apk

      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/') && matrix.variant == 'release'
        run: |
          # --exclude='*-debug'：跳过 CI 自动创建的派生 debug tag，只对比正式版本 tag
          PREV="$(git describe --tags --abbrev=0 --exclude='*-debug' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "## 提交详情"
            echo
            # 转义 @提及（如提交正文里的 Kotlin 注解 @Synchronized 会被 GitHub 渲染成对用户 @synchronized 的引用）
            git log --no-merges --format='### %s (%h)%n%n%b%n' "$RANGE" \
              | sed -E 's/@([A-Za-z0-9][A-Za-z0-9-]*)/\\@\1/g'
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: 生成 Debug Release 说明
        if: startsWith(github.ref, 'refs/tags/') && matrix.variant == 'debug'
        run: |
          {
            echo "## Debug 可调试包"
            echo
            echo "此为 \`${GITHUB_REF_NAME}\` 的可调试构建，与正式版功能一致但额外开启："
            echo
            echo "- \`applicationId\` 带 \`.debug\` 后缀，可与正式包并存安装"
            echo "- WebView 远程调试（\`chrome://inspect\`）"
            echo "- Logcat → console 透传（方便排查前端错误）"
            echo
            echo "> 存储/登录态/缓存与正式包相互独立，卸载不影响正式版。"
            echo
            echo "⚠️ **端口共用提示**：本地服务端口（KotlinApiServer :13962 / Node :13233）为硬编码常量，"
            echo "debug 包与正式包共用。**测试 debug 包前必须先彻底退出（强制停止）正式包**，"
            echo "否则正式包前台服务持有端口，debug 包的 API 请求会连到正式包进程，"
            echo "导致登录复现失真且 debug 的 chrome://inspect 看不到诊断日志。"
            echo
            echo "_后续开放问题：按变体分端口偏移（buildConfigField + Kotlin/TS/Node 联动）根治端口冲突。_"
          } > debug-notes.md
          cat debug-notes.md

      # softprops/action-gh-release 传 tag_name 时派生 tag 建在 target_commitish（默认=仓库默认分支 HEAD），
      # 故 debug 变体显式钉 github.sha 确保 tag 指向本次构建 commit
      - name: 生成差异化热更新 Manifest 清单 (Issue #26)
        if: matrix.variant == 'release'
        run: |
          mkdir -p dist-live-update
          ./node_modules/.bin/tsx scripts/generate-live-update-manifest.ts dist/capacitor dist-live-update --version "${{ github.ref_name }}" --channel "stable"
          cp dist-live-update/manifest.json dist-android/manifest.json
          if [ -f "dist-live-update/manifest.sig" ]; then
            cp dist-live-update/manifest.sig dist-android/manifest.sig
          fi

      - name: 发布正式版 Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.variant == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: |
            dist-android/*.apk
            dist-android/manifest.json
            dist-android/manifest.sig
          body_path: release-notes.md
          generate_release_notes: true

      - name: 发布 Debug 预发布 Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.variant == 'debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-debug
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }} (debug)
          prerelease: true
          files: dist-android/*.apk
          body_path: debug-notes.md
          # 派生 tag 无对比基准，generate_release_notes 会异常，关闭改用自生成说明
          generate_release_notes: false

  # PR 标签驱动测试构建：ci:debug 产出 debug APK，ci:dual 产出 release+debug
  # 标签需在仓库 Settings → Labels 预先创建；ci:dual 的 release 变体依赖签名 secrets（仅同仓分支 PR 可用，fork PR 拿不到 secrets）
  build-pr-apk:
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'ci:debug') ||
      contains(github.event.pull_request.labels.*.name, 'ci:dual'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已从 secrets 恢复正式签名密钥"
          else
            echo "未配置签名 secrets，回退 debug 签名（app/build.gradle 自带回退逻辑）"
          fi
      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 构建 Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace
      - name: 构建 Release APK
        if: contains(github.event.pull_request.labels.*.name, 'ci:dual')
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: 收集 Debug APK
        run: |
          mkdir -p dist-android-debug
          PR_NUM="${{ github.event.pull_request.number }}"
          SRC_DIR="android/app/build/outputs/apk/debug"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${SRC_DIR}/app-${abi}-debug.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist-android-debug/SPlayer-Next-PR${PR_NUM}-debug-${abi}.apk"
            fi
          done
          [ -n "$(ls -A dist-android-debug 2>/dev/null)" ] || {
            echo "::error::No debug APK collected"
            ls -la "$SRC_DIR" 2>/dev/null || echo "source dir does not exist"
            exit 1
          }
          ls -la dist-android-debug
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-PR${{ github.event.pull_request.number }}-debug
          path: dist-android-debug/*.apk

      - name: 收集 Release APK
        if: contains(github.event.pull_request.labels.*.name, 'ci:dual')
        run: |
          mkdir -p dist-android-release
          PR_NUM="${{ github.event.pull_request.number }}"
          SRC_DIR="android/app/build/outputs/apk/release"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="${SRC_DIR}/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist-android-release/SPlayer-Next-PR${PR_NUM}-release-${abi}.apk"
            fi
          done
          [ -n "$(ls -A dist-android-release 2>/dev/null)" ] || {
            echo "::error::No release APK collected"
            ls -la "$SRC_DIR" 2>/dev/null || echo "source dir does not exist"
            exit 1
          }
          ls -la dist-android-release
      - name: 上传 Release APK
        if: contains(github.event.pull_request.labels.*.name, 'ci:dual')
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-PR${{ github.event.pull_request.number }}-release
          path: dist-android-release/*.apk
