name: CI

on:
  pull_request:
  push:
    # Android 主线也纳入：否则直接 push / squash 合并到 Android 时不跑 format/lint/typecheck，
    # 脏文件可绕过校验进入主线，再拖垮后续所有基于它的 PR（见 issue #8 的 README 实例）
    branches: [main, dev, Android]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_NATIVE_BUILD: true
